<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>
    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <section class="sources-panel" aria-labelledby="sources-heading">
                <div class="section-heading">
                    <h2 id="sources-heading">Publishers</h2>
                </div>
                <label class="search-label" for="source-search">Find a publisher</label>
                <input id="source-search" type="search" placeholder="Search publishers…" autocomplete="off" />
                <div class="sources buttons"></div>
                <p class="sources__no-results" hidden>No publishers found. Try another name.</p>
            </section>
            <section class="stories" id="stories" aria-labelledby="stories-heading">
                <div class="section-heading section-heading--news">
                    <h2 id="stories-heading">News</h2>
                </div>
                <div class="news" aria-live="polite">
                    <p class="news__empty">Select media to see its news.</p>
                </div>
            </section>
        </main>
        <footer class="footer">
            <a class="footer__nickname" href="https://github.com/Mindvan">Mindvan</a>
            <a class="footer__logo-link" href="https://rs.school/">
                <img class="footer__logo" src="assets/rs_logo.png" alt="RS School" width="600" height="216" />
            </a>
            <span class="footer__copyright">&copy; 2026</span>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
